services:
  # -----------------------------------------------------------------------
  # FalkorDB — graph database (Redis-protocol compatible, 7x lighter than Neo4j)
  # Graphiti uses this as its bi-temporal storage backend.
  # -----------------------------------------------------------------------
  falkordb:
    image: falkordb/falkordb:latest
    restart: unless-stopped
    ports:
      - "6379:6379"   # Redis protocol (Graphiti connects here)
      - "3000:3000"   # FalkorDB Web UI (http://localhost:3000)
    volumes:
      - falkordb_data:/var/lib/falkordb/data
    command: falkordb --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # -----------------------------------------------------------------------
  # Graphiti Wrapper — Python FastAPI service that wraps graphiti-core
  # Edge Functions call this via HTTP to add/query medical facts.
  # -----------------------------------------------------------------------
  graphiti-wrapper:
    build: ./python/graphiti-wrapper
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - FALKORDB_HOST=falkordb
      - FALKORDB_PORT=6379
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_BASE_URL=https://openrouter.ai/api/v1
      - ENTITY_EXTRACT_MODEL=deepseek/deepseek-chat-v3-0324
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - EMBED_MODEL=gemini-embedding-001
      - EMBED_DIM=768
      - LAYER_1_VISION_MODEL=google/gemma-4-26b-a4b-it:free
    depends_on:
      falkordb:
        condition: service_healthy

  # -----------------------------------------------------------------------
  # Postgres — local dev mirror of Supabase Postgres
  # The actual Supabase cloud DB is used in staging/production.
  # This is only for offline local development.
  # -----------------------------------------------------------------------
  postgres:
    image: postgres:16
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: caregiver_briefing
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  falkordb_data:
  postgres_data:
